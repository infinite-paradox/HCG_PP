<!doctype html>
<html lang="en">
  <head>
    <!-- core meta workflow -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title | SEO-->
    <title>Mira Halvorsen — Wayfinding &amp; Sign Systems, Rotterdam</title>
    <meta
      name="description"
      content="Mira Halvorsen is an environmental graphic designer in Rotterdam. Sign Systems, pictograms and accessible wayfinding for transit, hospitals and public buildings since 2014,"
    />
    <meta name="author" content="Mira Halvorsen" />
    <meta name="theme-color" content="#f1ede4" />
    <link rel="canonical" href="https://mirahalvorsen.example/" />

    <!-- Favicon -->
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />

    <!-- websites Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap"
    />

    <!-- Style CSS -->
    <link rel="stylesheet" href="./style.css" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Mira Halvorsen — Wayfinding &amp; Sign Systems"
    />
    <meta
      property="og:description"
      content="Sign systems, pictograms and accessible wayfinding for transit, hospitals and public buildings. Studio in Rotterdam, working since 2014."
    />
    <meta
      property="og:image"
      content="https://mirahalvorsen.example/share/line-d-plate-1200x630.jpg"
    />
    <meta
      property="og:image:alt"
      content="Enamel destination plate for Line D, showing a white arrow and three station names."
    />
    <meta property="og:url" content="https://mirahalvorsen.example/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mira Halvorsen" />
    <meta property="og:local" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mirahalvorsen" />
    <meta name="twitter:creator" content="@mirahalvorsen" />
    <meta
      name="twitter:title"
      content="Mira Halvorsen — Wayfinding &amp; Sign Systems"
    />
    <meta
      name="twitter:description"
      content="Sign systems, pictograms and accessible wayfinding for transit, hospitals and public buildings. Rotterdam."
    />
    <meta
      name="twitter:image"
      content="https://mirahalvorsen.example/share/line-d-plate-1200x630.jpg"
    />
