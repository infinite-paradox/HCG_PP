<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="plateTitle plateDesc">
  <title id="plateTitle">Specimen plate for Line D, seven stations</title>
  <desc id="plateDesc">A dark enamel panel with a white arrow pointing right, the word UITGANG, and three destinations: Centraal, Depot and Markthal.</desc>

  <rect width="1200" height="800" fill="#1c1f21"/>
  <rect x="28" y="28" width="1144" height="744" fill="none" stroke="#f2efe7" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Top-left label -->
  <text x="96" y="126" fill="#f2efe7" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="26" letter-spacing="7">UITGANG / EXIT</text>

  <!-- Arrow -->
  <path d="M96 272h504v-72l148 108-148 108v-72H96z" fill="#f2efe7"/>

  <!-- Divider -->
  <line x1="800" y1="180" x2="800" y2="580" stroke="#f2efe7" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Destination rows -->
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
    <text x="856" y="250" fill="#b93d28" font-size="34" letter-spacing="2">1</text>
    <text x="918" y="250" fill="#f2efe7" font-size="48" letter-spacing="3">CENTRAAL</text>
    <line x1="856" y1="292" x2="1104" y2="292" stroke="#f2efe7" stroke-opacity="0.16" stroke-width="2"/>

    <text x="856" y="372" fill="#b93d28" font-size="34" letter-spacing="2">2</text>
    <text x="918" y="372" fill="#f2efe7" font-size="48" letter-spacing="3">DEPOT</text>
    <line x1="856" y1="414" x2="1104" y2="414" stroke="#f2efe7" stroke-opacity="0.16" stroke-width="2"/>

    <text x="856" y="494" fill="#b93d28" font-size="34" letter-spacing="2">3</text>
    <text x="918" y="494" fill="#f2efe7" font-size="48" letter-spacing="3">MARKTHAL</text>
    <line x1="856" y1="536" x2="1104" y2="536" stroke="#f2efe7" stroke-opacity="0.16" stroke-width="2"/>
  </g>

  <!-- Footer strip -->
  <line x1="96" y1="650" x2="1104" y2="650" stroke="#f2efe7" stroke-opacity="0.16" stroke-width="2"/>
  <text x="96" y="708" fill="#b9bcb6" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="24" letter-spacing="4">LINE D · SEVEN STATIONS · 2024</text>
  <text x="1104" y="708" fill="#b9bcb6" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="24" letter-spacing="4">900 × 400 MM</text>
  <rect x="96" y="744" width="72" height="6" fill="#b93d28"/>
</svg>
